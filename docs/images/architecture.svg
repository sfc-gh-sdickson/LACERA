  <rect x="80" y="550" width="1040" height="110" rx="8" fill="#fff8e1" stroke="#f5a623" stroke-width="1"/>
  <text x="600" y="573" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">RAW Schema - Ingestion Layer</text>
  <rect x="100" y="585" width="110" height="30" rx="4" fill="#ffffff" stroke="#f5a623" stroke-width="0.5"/>
  <text x="155" y="605" text-anchor="middle" font-size="9" fill="#1a1a2e">PORTFOLIO_HOLDINGS</text>
  <rect x="220" y="585" width="110" height="30" rx="4" fill="#ffffff" stroke="#f5a623" stroke-width="0.5"/>
  <text x="275" y="605" text-anchor="middle" font-size="9" fill="#1a1a2e">PERFORMANCE</text>
  <rect x="340" y="585" width="110" height="30" rx="4" fill="#ffffff" stroke="#f5a623" stroke-width="0.5"/>
  <text x="395" y="605" text-anchor="middle" font-size="9" fill="#1a1a2e">TRANSACTIONS</text>
  <rect x="460" y="585" width="100" height="30" rx="4" fill="#ffffff" stroke="#f5a623" stroke-width="0.5"/>
  <text x="510" y="605" text-anchor="middle" font-size="9" fill="#1a1a2e">RISK_METRICS</text>
  <rect x="570" y="585" width="100" height="30" rx="4" fill="#ffffff" stroke="#f5a623" stroke-width="0.5"/>
  <text x="620" y="605" text-anchor="middle" font-size="9" fill="#1a1a2e">MANAGERS</text>
  <rect x="680" y="585" width="100" height="30" rx="4" fill="#ffffff" stroke="#f5a623" stroke-width="0.5"/>
  <text x="730" y="605" text-anchor="middle" font-size="9" fill="#1a1a2e">ESG_SCORES</text>
  <rect x="790" y="585" width="100" height="30" rx="4" fill="#ffffff" stroke="#f5a623" stroke-width="0.5"/>
  <text x="840" y="605" text-anchor="middle" font-size="9" fill="#1a1a2e">PROXY_VOTES</text>
  <rect x="900" y="585" width="100" height="30" rx="4" fill="#ffffff" stroke="#f5a623" stroke-width="0.5"/>
  <text x="950" y="605" text-anchor="middle" font-size="9" fill="#1a1a2e">COMPLIANCE</text>
  <rect x="100" y="623" width="110" height="30" rx="4" fill="#ffffff" stroke="#f5a623" stroke-width="0.5"/>
  <text x="155" y="643" text-anchor="middle" font-size="9" fill="#1a1a2e">BOARD_MATERIALS</text>
  <rect x="220" y="623" width="110" height="30" rx="4" fill="#ffffff" stroke="#f5a623" stroke-width="0.5"/>
  <text x="275" y="643" text-anchor="middle" font-size="9" fill="#1a1a2e">POLICY_DOCS</text>
  <rect x="340" y="623" width="120" height="30" rx="4" fill="#ffffff" stroke="#f5a623" stroke-width="0.5"/>
  <text x="400" y="643" text-anchor="middle" font-size="9" fill="#1a1a2e">MANAGER_RESEARCH</text>

  <!-- Arrow pointing UP from Data Sources to Snowflake Platform -->
  <line x1="600" y1="700" x2="600" y2="680" stroke="#29b5e8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Data Sources Layer (bottom) -->
  <rect x="50" y="700" width="1100" height="90" rx="10" fill="#e8f4f8" stroke="#29b5e8" stroke-width="1.5"/>
  <text x="600" y="723" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">External Data Sources</text>
  <rect x="80" y="735" width="150" height="40" rx="6" fill="#ffffff" stroke="#29b5e8" stroke-width="1"/>
  <text x="155" y="755" text-anchor="middle" font-size="9" fill="#1a1a2e">State Street</text>
  <text x="155" y="767" text-anchor="middle" font-size="8" fill="#666666">Custodian / Holdings</text>
  <rect x="260" y="735" width="150" height="40" rx="6" fill="#ffffff" stroke="#29b5e8" stroke-width="1"/>
  <text x="335" y="755" text-anchor="middle" font-size="9" fill="#1a1a2e">Solovis</text>
  <text x="335" y="767" text-anchor="middle" font-size="8" fill="#666666">Portfolio Analytics</text>
  <rect x="440" y="735" width="150" height="40" rx="6" fill="#ffffff" stroke="#29b5e8" stroke-width="1"/>
  <text x="515" y="755" text-anchor="middle" font-size="9" fill="#1a1a2e">MSCI BarraOne</text>
  <text x="515" y="767" text-anchor="middle" font-size="8" fill="#666666">Risk Analytics</text>
  <rect x="620" y="735" width="150" height="40" rx="6" fill="#ffffff" stroke="#29b5e8" stroke-width="1"/>
  <text x="695" y="755" text-anchor="middle" font-size="9" fill="#1a1a2e">Canoe Intelligence</text>
  <text x="695" y="767" text-anchor="middle" font-size="8" fill="#666666">Private Markets AI</text>
  <rect x="800" y="735" width="150" height="40" rx="6" fill="#ffffff" stroke="#29b5e8" stroke-width="1"/>
  <text x="875" y="755" text-anchor="middle" font-size="9" fill="#1a1a2e">GRESB / EDCI</text>
  <text x="875" y="767" text-anchor="middle" font-size="8" fill="#666666">ESG Frameworks</text>
  <rect x="980" y="735" width="150" height="40" rx="6" fill="#ffffff" stroke="#29b5e8" stroke-width="1"/>
  <text x="1055" y="755" text-anchor="middle" font-size="9" fill="#1a1a2e">ISS Proxy Exchange</text>
  <text x="1055" y="767" text-anchor="middle" font-size="8" fill="#666666">Proxy Voting</text>
</svg>
