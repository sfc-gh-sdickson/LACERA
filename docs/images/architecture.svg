<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a2e">LACERA Intelligence Agent - System Architecture</text>

  <!-- Marker definitions -->
  <defs>
    <marker id="arrowBlue" markerWidth="5" markerHeight="3.5" refX="4.5" refY="1.75" orient="auto"><polygon points="0 0, 5 1.75, 0 3.5" fill="#29b5e8"/></marker>
    <marker id="arrowBlueUp" markerWidth="5" markerHeight="3.5" refX="0.5" refY="1.75" orient="auto"><polygon points="5 0, 0 1.75, 5 3.5" fill="#29b5e8"/></marker>
  </defs>

  <!-- Users Layer (top) -->
  <rect x="350" y="60" width="500" height="40" rx="6" fill="#fce4ec" stroke="#e91e63" stroke-width="1"/>
  <text x="600" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">Users: CIO, Investment Staff, Board of Investments, Compliance Team</text>

  <!-- Arrow down from Users to Agent -->
  <line x1="600" y1="100" x2="600" y2="120" stroke="#1976d2" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Agent Layer -->
  <rect x="250" y="120" width="700" height="120" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="600" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#1976d2">LACERA Intelligence Agent</text>
  <text x="600" y="175" text-anchor="middle" font-size="11" fill="#1a1a2e">Natural Language Interface for Investment Analytics</text>
  <rect x="290" y="190" width="160" height="30" rx="4" fill="#bbdefb" stroke="#1976d2" stroke-width="0.5"/>
  <text x="370" y="210" text-anchor="middle" font-size="9" fill="#1a1a2e">Cortex Analyst (SQL)</text>
  <rect x="470" y="190" width="160" height="30" rx="4" fill="#bbdefb" stroke="#1976d2" stroke-width="0.5"/>
  <text x="550" y="210" text-anchor="middle" font-size="9" fill="#1a1a2e">Cortex Search (RAG)</text>
  <rect x="650" y="190" width="160" height="30" rx="4" fill="#bbdefb" stroke="#1976d2" stroke-width="0.5"/>
  <text x="730" y="210" text-anchor="middle" font-size="9" fill="#1a1a2e">ML Functions</text>
  <rect x="830" y="190" width="100" height="30" rx="4" fill="#bbdefb" stroke="#1976d2" stroke-width="0.5"/>
  <text x="880" y="210" text-anchor="middle" font-size="9" fill="#1a1a2e">Orchestration</text>

  <!-- Snowflake Platform -->
  <rect x="50" y="260" width="1100" height="420" rx="10" fill="#f0f8ff" stroke="#29b5e8" stroke-width="2"/>
  <text x="600" y="288" text-anchor="middle" font-size="16" font-weight="bold" fill="#29b5e8">Snowflake Platform - LACERA_DB</text>

  <!-- Cortex AI / ML Layer (top inside platform) -->
  <rect x="80" y="300" width="1040" height="100" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1"/>
  <text x="600" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">Cortex AI / ML Layer</text>
  <rect x="120" y="340" width="280" height="45" rx="4" fill="#ffffff" stroke="#9c27b0" stroke-width="0.5"/>
  <text x="260" y="360" text-anchor="middle" font-size="10" fill="#1a1a2e">FORECAST_RETURNS()</text>
  <text x="260" y="375" text-anchor="middle" font-size="8" fill="#666666">Time-series return prediction by asset class</text>
  <rect x="430" y="340" width="280" height="45" rx="4" fill="#ffffff" stroke="#9c27b0" stroke-width="0.5"/>
  <text x="570" y="360" text-anchor="middle" font-size="10" fill="#1a1a2e">DETECT_RISK_ANOMALIES()</text>
  <text x="570" y="375" text-anchor="middle" font-size="8" fill="#666666">Anomaly detection on risk metrics</text>
  <rect x="740" y="340" width="280" height="45" rx="4" fill="#ffffff" stroke="#9c27b0" stroke-width="0.5"/>
  <text x="880" y="360" text-anchor="middle" font-size="10" fill="#1a1a2e">SCORE_MANAGER_PERFORMANCE()</text>
  <text x="880" y="375" text-anchor="middle" font-size="8" fill="#666666">Composite manager scoring model</text>

