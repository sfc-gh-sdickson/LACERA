  <rect x="100" y="455" width="150" height="30" rx="4" fill="#ffffff" stroke="#4caf50" stroke-width="0.5"/>
  <text x="175" y="475" text-anchor="middle" font-size="9" fill="#1a1a2e">PORTFOLIO_ALLOCATION_VW</text>
  <rect x="260" y="455" width="150" height="30" rx="4" fill="#ffffff" stroke="#4caf50" stroke-width="0.5"/>
  <text x="335" y="475" text-anchor="middle" font-size="9" fill="#1a1a2e">PERFORMANCE_ATTR_VW</text>
  <rect x="420" y="455" width="150" height="30" rx="4" fill="#ffffff" stroke="#4caf50" stroke-width="0.5"/>
  <text x="495" y="475" text-anchor="middle" font-size="9" fill="#1a1a2e">RISK_DASHBOARD_VW</text>
  <rect x="580" y="455" width="150" height="30" rx="4" fill="#ffffff" stroke="#4caf50" stroke-width="0.5"/>
  <text x="655" y="475" text-anchor="middle" font-size="9" fill="#1a1a2e">COMPLIANCE_MONITOR_VW</text>
  <rect x="740" y="455" width="150" height="30" rx="4" fill="#ffffff" stroke="#4caf50" stroke-width="0.5"/>
  <text x="815" y="475" text-anchor="middle" font-size="9" fill="#1a1a2e">ESG_PORTFOLIO_VW</text>
  <rect x="900" y="455" width="150" height="30" rx="4" fill="#ffffff" stroke="#4caf50" stroke-width="0.5"/>
  <text x="975" y="475" text-anchor="middle" font-size="9" fill="#1a1a2e">MANAGER_PERF_VW</text>
  <rect x="360" y="493" width="230" height="28" rx="4" fill="#c8e6c9" stroke="#4caf50" stroke-width="1"/>
  <text x="475" y="512" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a1a2e">3 SEMANTIC VIEWS (Cortex Analyst)</text>
  <rect x="610" y="493" width="230" height="28" rx="4" fill="#c8e6c9" stroke="#4caf50" stroke-width="1"/>
  <text x="725" y="512" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a1a2e">3 CORTEX SEARCH SERVICES</text>

